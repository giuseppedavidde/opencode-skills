[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-mcp-server"
version = "0.1.0"
description = "MCP server for stock/crypto market analysis using Wyckoff, Volume Profile, VPA, and options analysis"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds stop a new major release from changing the numbers without a
# review (DATA-16). The exact versions live in requirements.lock; regenerate it with
#   uv pip compile mcp/pyproject.toml --universal --python-version 3.11 -o mcp/requirements.lock
dependencies = [
    "fastmcp>=3.0,<4",
    "yfinance>=1.5,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0,<5",
    "pytest>=8.0,<10",
]

[project.scripts]
trading-mcp = "trading_mcp.main:run_app"
trading-cli = "trading_mcp.trading_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require live network access (yfinance option chains)",
]
