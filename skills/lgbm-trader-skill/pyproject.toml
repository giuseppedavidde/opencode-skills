[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lgbm-trader"
version = "0.1.0"
description = "LightGBM Trading System with Feature Engineering & Signal Stacking"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.30",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "optuna>=3.3",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "pydantic>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "requests>=2.28",
]

[project.optional-dependencies]
explainability = ["shap>=0.42"]
indicators = ["pandas-ta>=0.3.14b0"]

[tool.setuptools]
packages = ["data", "features", "models", "backtest", "signals", "utils"]